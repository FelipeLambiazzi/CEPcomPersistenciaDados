<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Usuários</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Cadastro de Usuários</h1>

    <form id="formCadastro">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" />
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" />
      </div>

      <div class="campo">
        <label for="cep">CEP</label>
        <input
          type="text"
          id="cep"
          name="cep"
          placeholder="00000-000"
          maxlength="9"
        />
      </div>

      <div class="campo">
        <label for="logradouro">Logradouro</label>
        <input type="text" id="logradouro" name="logradouro" readonly />
      </div>

      <div class="campo">
        <label for="numero">Número</label>
        <input type="text" id="numero" name="numero" placeholder="Número" />
      </div>

      <div class="campo">
        <label for="complemento">Complemento</label>
        <input type="text" id="complemento" name="complemento" placeholder="Apartamento, bloco, etc." />
      </div>

      <div class="campo">
        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" name="bairro" readonly />
      </div>

      <div class="campo">
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" readonly />
      </div>

      <div class="campo">
        <label for="estado">Estado</label>
        <input type="text" id="estado" name="estado" readonly />
      </div>

      <div class="acoes">
        <button type="submit">Salvar cadastro</button>
        <button type="button" id="btnLimpar" class="secundario">Limpar dados</button>
      </div>

      <p id="mensagem"></p>
    </form>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
